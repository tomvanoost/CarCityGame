server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json model/gltf+json image/svg+xml;

  # Hashed build assets and 3D models can be cached for a long time
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /models/ { expires 7d; add_header Cache-Control "public"; }
  location = /config.js { add_header Cache-Control "no-store"; }

  location / { try_files $uri $uri/ /index.html; }
}
