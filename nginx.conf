server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json model/gltf+json image/svg+xml;

  # Hashed build assets (new name on every change) can be cached for a long time.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # 3D models keep their file names when they are fixed: the browser keeps its copy but asks
  # every time if it is still current (a tiny "304 Not Modified" when nothing changed).
  location /models/ { add_header Cache-Control "public, no-cache"; }
  location = /config.js { add_header Cache-Control "no-store"; }
  # index.html must never be stale, otherwise a new deploy still runs the old game code.
  location = /index.html { add_header Cache-Control "no-cache"; }

  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
